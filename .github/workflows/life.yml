name: life

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/life.py]

permissions:
  contents: write

jobs:
  life:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate life.svg
        run: python3 scripts/life.py --test && python3 scripts/life.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/life.svg
          git diff --cached --quiet || (git commit -m "chore: regenerate life.svg" && git push)
